# Local development stack for otoroshi-api-management
#  - postgres: one server, two databases (app data + analytics), as the product expects two connection urls
#  - otoroshi: the gateway (18.x) the product drives, admin api on otoroshi-api.oto.tools:8080
#  - echo: a demo backend for the apis created in the console
#  - apim: the product itself, from the working copy (bun --watch), reachable by otoroshi as
#    http://apim:9000 so that the data exporter can feed /ingest
name: otoroshi-apim
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: apim
      POSTGRES_PASSWORD: apim
      POSTGRES_DB: apim
    ports:
      - "5442:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apim"]
      interval: 2s
      timeout: 2s
      retries: 30

  otoroshi:
    image: eclipse-temurin:21-jre
    # the extensions of the gateway on its classpath — the Threat Protection Suite, the LLM extension:
    # the jars of OTOROSHI_EXTENSIONS (a directory, docker/extensions by default, empty), enabled here
    command:
      - java
      - -Xmx2g
      - -Dotoroshi.admin-extensions.configurations.cloud-apim_extensions_waf.enabled=true
      - -Dotoroshi.admin-extensions.configurations.cloud-apim_extensions_llmextension.enabled=true
      - -cp
      - /otoroshi/otoroshi.jar:/otoroshi/extensions/*
      - play.core.server.ProdServerStart
    environment:
      # its state in a file of the otodata volume: kept across a restart, a new jar, `mise run down`;
      # `mise run reset` wipes it
      APP_STORAGE: file
      OTOROSHI_FILEDB_PATH: /data/state.ndjson
      APP_DOMAIN: oto.tools
      OTOROSHI_INITIAL_ADMIN_LOGIN: admin@otoroshi.io
      OTOROSHI_INITIAL_ADMIN_PASSWORD: password
      OTOROSHI_ADMIN_API_CLIENT_ID: apim-admin-client
      OTOROSHI_ADMIN_API_CLIENT_SECRET: apim-admin-secret
    ports:
      - "8080:8080"
    volumes:
      - ${OTOROSHI_JAR:-../../otoroshi.jar}:/otoroshi/otoroshi.jar:ro
      - ${OTOROSHI_EXTENSIONS:-./extensions}:/otoroshi/extensions:ro
      - otodata:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  echo:
    image: mendhak/http-https-echo:36
    environment:
      HTTP_PORT: 8080
      HTTPS_PORT: 8443

  # a development OpenID Connect provider (interactive: sign in as anyone). Reachable with the same
  # issuer from the browser (oidc.oto.tools -> 127.0.0.1:8090) and from the containers (alias)
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      SERVER_PORT: "8090"
      JSON_CONFIG: '{"interactiveLogin": true}'
    ports:
      - "8090:8090"
    networks:
      default:
        aliases: [oidc.oto.tools]

  # serves examples/ as a remote catalog source (http kind), at http://catalog.oto.tools/
  catalog:
    image: busybox:1.37
    command: ["httpd", "-f", "-p", "80", "-h", "/srv"]
    volumes:
      - ../examples:/srv:ro
    networks:
      default:
        aliases: [catalog.oto.tools]

  apim:
    image: oven/bun:1.3.11
    working_dir: /app
    command: ["bun", "--watch", "server/main.js"]
    environment:
      # the values of the development stack for what is not given here (server/config.js)
      DEV: "true"
      APIM_DATABASE_URL: postgres://apim:apim@postgres:5432/apim
      APIM_ANALYTICS_DATABASE_URL: postgres://apim:apim@postgres:5432/apim_analytics
      OTOROSHI_URL: http://otoroshi:8080
      APIM_INGEST_URL: http://apim:9000/ingest
      APIM_PUBLIC_URL: http://localhost:9000
      # the fake Stripe of the development: a Checkout is a page of the product
      APIM_PAYMENTS_PROVIDER: fake
      # the emails of the development: written to the log of the product (docker compose logs apim)
      APIM_EMAIL_TRANSPORT: log
      APIM_EMAIL_FROM: API portal <no-reply@oto.tools>
      # the key the secrets are sealed with — the one of mise.toml and of the tests: they share the database
      APIM_SECRETS_KEY: development-only-secrets-key
    ports:
      - "9000:9000"
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["apim"]

volumes:
  pgdata:
  otodata:
