# The secrets of an installation — not in the kustomization: create it with your own values (or
# from a vault, an external-secrets operator…).
apiVersion: v1
kind: Secret
metadata:
  name: otoroshi-api-management
type: Opaque
stringData:
  database-url: postgres://apim:change-me@postgres.apim.svc.cluster.local:5432/apim
  analytics-database-url: postgres://apim:change-me@postgres.apim.svc.cluster.local:5432/apim_analytics
  otoroshi-client-id: apim-admin-client
  otoroshi-client-secret: change-me
  admin-token: change-me
  ingest-token: change-me
  bootstrap-password: change-me
  # the key the product seals the secrets it keeps with (openssl rand -hex 32); on a rotation, the
  # previous ones in secrets-previous-keys, comma-separated
  secrets-key: change-me
