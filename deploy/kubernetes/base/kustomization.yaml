# otoroshi-api-management on Kubernetes: the product (api, console, portals, ingester), its
# controller of the cluster's resources, and the custom resources it reconciles.
#
#   kubectl create namespace apim
#   kubectl -n apim apply -f secret.example.yaml   # edited: databases, Otoroshi key, tokens
#   kubectl -n apim apply -k deploy/kubernetes/base
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# change it in an overlay — with the namespace of the subject of the controller's ClusterRoleBinding
# and the one in APIM_INGEST_URL, which kustomize leaves as they are (documentation › Install on
# Kubernetes)
namespace: apim
labels:
  - pairs:
      app.kubernetes.io/part-of: otoroshi-api-management
resources:
  - ../crds
  - configmap.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - apim.yaml
  - controller.yaml
images:
  # the image the release publishes (.github/workflows/release.yaml); `kustomize edit set image` pins another
  - name: otoroshi-api-management
    newName: ghcr.io/cloud-apim/otoroshi-api-management
    newTag: latest
