apiVersion: v1
kind: Service
metadata:
  name: {{ include "apim.fullname" . }}
  labels: {{- include "apim.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "apim.fullname" . }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
