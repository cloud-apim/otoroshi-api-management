{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apim.fullname" . }}
  labels: {{- include "apim.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ required "secrets.databaseUrl is required (or secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  analytics-database-url: {{ required "secrets.analyticsDatabaseUrl is required (or secrets.existingSecret)" .Values.secrets.analyticsDatabaseUrl | quote }}
  otoroshi-client-id: {{ required "secrets.otoroshiClientId is required (or secrets.existingSecret)" .Values.secrets.otoroshiClientId | quote }}
  otoroshi-client-secret: {{ required "secrets.otoroshiClientSecret is required (or secrets.existingSecret)" .Values.secrets.otoroshiClientSecret | quote }}
  admin-token: {{ required "secrets.adminToken is required (or secrets.existingSecret)" .Values.secrets.adminToken | quote }}
  ingest-token: {{ required "secrets.ingestToken is required (or secrets.existingSecret)" .Values.secrets.ingestToken | quote }}
  bootstrap-password: {{ required "secrets.bootstrapPassword is required (or secrets.existingSecret)" .Values.secrets.bootstrapPassword | quote }}
  secrets-key: {{ required "secrets.secretsKey is required (or secrets.existingSecret): the key the product seals its secrets with" .Values.secrets.secretsKey | quote }}
  {{- with .Values.secrets.secretsPreviousKeys }}
  secrets-previous-keys: {{ . | quote }}
  {{- end }}
{{- end }}
