# otoroshi-api-management — every value maps to a variable of the documentation › Install.

# the image the release publishes; the tag defaults to the appVersion of the chart
image:
  repository: ghcr.io/cloud-apim/otoroshi-api-management
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# the product: admin api, console, developer portals, ingester. Several replicas share the
# projection queue (a task is claimed by one of them).
replicaCount: 2
roles: ingester,api,backoffice,portal

# the controller of the product's resources (Api, Application, Subscription): one replica
controller:
  enabled: true
  resyncMs: 10000
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

config:
  publicUrl: https://apim.example.com
  installationName: production
  # the single Otoroshi cluster this installation drives
  otoroshi:
    url: http://otoroshi-api.otoroshi.svc.cluster.local:8080
    host: otoroshi-api.oto.tools
    publicScheme: https
    publicPort: 443
    backofficeUrl: ""
  # /ingest as the gateway reaches it; empty: the service of this release
  ingestUrl: ""
  tenancy: multi
  portal:
    exposure: path
    domain: ""
    url: ""
  bootstrapAdmins: admin@example.com
  cookieSecure: true
  # the connections each pod (the replicas and the controller) may open to each database: their sum
  # stays under the max_connections of PostgreSQL
  database:
    pool: 10
    analyticsPool: 5
  # any other variable that is not secret, in the ConfigMap: { APIM_EMAIL_TRANSPORT: smtp }
  extraEnv: {}

# the secrets: an existing Secret (with the keys below), or the values here
secrets:
  existingSecret: ""
  databaseUrl: ""
  analyticsDatabaseUrl: ""
  otoroshiClientId: ""
  otoroshiClientSecret: ""
  adminToken: ""
  ingestToken: ""
  bootstrapPassword: ""
  # the key the product seals the secrets it keeps with; on a rotation, the previous ones, comma-separated
  secretsKey: ""
  secretsPreviousKeys: ""
  # any other variable that is secret, in a Secret of the chart: { APIM_STRIPE_SECRET_KEY: sk_live_… }
  extraEnv: {}

# more sources of variables for both deployments, as envFrom entries: a Secret or a ConfigMap made
# elsewhere (an external-secrets operator, a vault), each key a variable
#   - secretRef: { name: apim-payments }
extraEnvFrom: []

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: false
  className: ""
  annotations: {}
  # the console, the admin api and the portals by path; add the portal hosts with the hostname exposure
  hosts:
    - host: apim.example.com
      paths: [{ path: /, pathType: Prefix }]
  tls: []

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }

# the user of the image (apim, uid 10001): its home, the working directory, is its own
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
securityContext:
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }

nodeSelector: {}
tolerations: []
affinity: {}
