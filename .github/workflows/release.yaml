name: release

# A tag v<version> publishes the product: its executables for linux and macos, x64 and arm64,
# attached to the GitHub release with their checksums, and its image for linux/amd64 and
# linux/arm64 on the GitHub container registry. Run by hand, it builds both and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  executables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: install
        run: bun install --frozen-lockfile

      - name: the tag is the version of the package
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "$GITHUB_REF_NAME"

      - name: build the console and the portal
        run: bun run build

      # bun fetches the runtime of each target
      - name: compile the executables
        run: bun scripts/build-binary.js --all

      - name: checksums
        working-directory: dist/bin
        run: sha256sum otoroshi-apim-* | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: executables
          path: |
            dist/bin/otoroshi-apim-*
            dist/bin/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/bin/otoroshi-apim-*
            dist/bin/SHA256SUMS
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the executable is cross-compiled in the build stage; the final stage installs git under
      # emulation for arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
