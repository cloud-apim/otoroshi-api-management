name: release

# A tag v<version> publishes the product: its executables for linux and macos, x64 and arm64, and
# its documentation as a zip, attached to the GitHub release with their checksums, and its image for
# linux/amd64 and linux/arm64 on the GitHub container registry. Run by hand, it builds all of them
# and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # the documentation site, built to be served from the root of any static server
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: documentation/package-lock.json

      - name: install
        working-directory: documentation
        run: npm ci

      - name: build
        working-directory: documentation
        env:
          DOCS_BASE_URL: /
        run: npm run build

      - name: zip
        run: |
          version="$(node -p 'require("./package.json").version')"
          name="otoroshi-api-management-docs-$version"
          mkdir -p dist
          mv documentation/build "dist/$name"
          {
            echo "The documentation of otoroshi-api-management $version, a static site."
            echo
            echo "Serve this directory from its root with any static web server, then open http://localhost:8000/ :"
            echo
            echo "  python3 -m http.server 8000"
            echo "  npx serve -l 8000"
            echo
            echo "Opened as files (file://), its pages do not work."
          } > "dist/$name/README.txt"
          (cd dist && zip -qr "$name.zip" "$name")

      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: dist/otoroshi-api-management-docs-*.zip

  executables:
    needs: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: install
        run: bun install --frozen-lockfile

      - name: the tag is the version of the package
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(bun -e 'console.log(require("./package.json").version)')" = "$GITHUB_REF_NAME"

      - name: build the console and the portal
        run: bun run build

      # bun fetches the runtime of each target
      - name: compile the executables
        run: bun scripts/build-binary.js --all

      # the zip of the documentation, beside the executables
      - uses: actions/download-artifact@v4
        with:
          name: documentation
          path: dist/bin

      - name: checksums
        working-directory: dist/bin
        run: sha256sum otoroshi-apim-* otoroshi-api-management-docs-*.zip | tee SHA256SUMS

      # the notes of the release: the section of its version in CHANGELOG.md, which has to exist
      - name: release notes
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          awk -v v="$version" '/^## /{on = index($0, "## " v " ") == 1 || $0 == "## " v; next} on' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md || { echo "no section for $version in CHANGELOG.md"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: executables
          path: |
            dist/bin/otoroshi-apim-*
            dist/bin/otoroshi-api-management-docs-*.zip
            dist/bin/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            dist/bin/otoroshi-apim-*
            dist/bin/otoroshi-api-management-docs-*.zip
            dist/bin/SHA256SUMS
          body_path: dist/release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the executable is cross-compiled in the build stage; the final stage installs git under
      # emulation for arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
